<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор открытки — InviteCard</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/editor.css">
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="/">✉️ <span>InviteCard</span></a>
  <div class="navbar-nav">
    <button class="btn btn-outline btn-sm" onclick="history.back()">← Назад</button>
    <button class="btn btn-primary btn-sm" onclick="saveCard()" id="saveBtn">Сохранить</button>
  </div>
</nav>

<!-- Шаг 1: выбор шаблона (показывается при создании новой) -->
<div id="stepTemplate" class="container" style="padding-top:2rem;padding-bottom:3rem">
  <h2 class="section-title">Выберите шаблон или начните с нуля</h2>
  <div class="grid-3" id="templatesList">
    <div class="spinner"></div>
  </div>
  <div class="mt-3 flex gap-2">
    <button class="btn btn-primary" onclick="startEditor()">Продолжить</button>
    <button class="btn btn-outline" onclick="selectTemplate(null)">С нуля</button>
  </div>
</div>

<!-- Шаг 2: редактор -->
<div id="stepEditor" style="display:none">
  <div class="editor-layout">

    <!-- Боковая панель -->
    <div class="editor-sidebar">
      <h3 style="margin-bottom:1.2rem;font-size:1rem;font-weight:700">Содержимое открытки</h3>

      <div class="form-group">
        <label>Заголовок открытки</label>
        <input type="text" id="cardTitle" class="form-control" placeholder="Название вашего мероприятия">
      </div>

      <div id="blocksPanel"></div>

      <button class="btn btn-outline w-full mt-2" onclick="toggleBlockPicker()">+ Добавить блок</button>

      <!-- Выбор типа блока -->
      <div id="blockTypePicker" style="display:none;margin-top:1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:1rem">
        <p style="font-size:0.85rem;font-weight:600;margin-bottom:0.8rem;color:var(--text-muted)">Выберите тип блока:</p>

        <p style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:0.4rem">📝 Текстовые</p>
        <div id="textBlockBtns" style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1rem"></div>

        <p style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:0.4rem">📁 Медиа</p>
        <div id="mediaBlockBtns" style="display:flex;flex-direction:column;gap:0.4rem"></div>
      </div>
    </div>

    <!-- Превью -->
    <div class="editor-preview">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h3 style="font-size:1rem;font-weight:700">Предпросмотр</h3>
        <div class="flex gap-1">
          <button class="btn btn-outline btn-sm" onclick="togglePreviewMode('mobile')" id="btnMobile">📱 Мобильный</button>
          <button class="btn btn-outline btn-sm" onclick="togglePreviewMode('desktop')" id="btnDesktop">🖥 Десктоп</button>
        </div>
      </div>
      <div id="previewWrapper" style="transition:max-width 0.3s;margin:0 auto">
        <div class="invite-preview" id="invitePreview"></div>
      </div>
    </div>

  </div>
</div>

<script src="/js/editor.js"></script>
</body>
</html>
