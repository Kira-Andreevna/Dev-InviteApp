<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — InviteCard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-color: #fce8ed; background-image: radial-gradient(ellipse 55% 45% at 80% 15%, rgba(232,25,44,0.18) 0%, transparent 65%), radial-gradient(ellipse 60% 55% at 15% 75%, rgba(220,100,130,0.22) 0%, transparent 60%), radial-gradient(ellipse 45% 50% at 60% 90%, rgba(232,25,44,0.12) 0%, transparent 55%), radial-gradient(ellipse 70% 40% at 30% 10%, rgba(255,180,200,0.25) 0%, transparent 60%); background-attachment: fixed;
      position: relative;
      overflow: hidden;
    }
    .auth-wrap::before, .auth-wrap::after { display: none; }
    .auth-box {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(201,116,138,0.15), 0 2px 8px rgba(0,0,0,0.04);
      padding: 2.8rem;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(240,221,227,0.8);
      position: relative;
      z-index: 1;
    }
    .auth-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.4rem;
    }
    .auth-box h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text);
    }
    .auth-box .auth-sub { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
    .auth-box .form-control {
      border-radius: 12px;
      border-color: var(--border);
      background: rgba(255,255,255,0.9);
    }
    .auth-box .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(201,116,138,0.12); }
    .btn-auth {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #a85570);
      color: #fff;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 18px rgba(201,116,138,0.35);
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,116,138,0.45); }
    .auth-footer { text-align: center; margin-top: 1.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <a href="/" class="auth-brand">💌 InviteCard</a>
    <h1>Добро пожаловать</h1>
    <p class="auth-sub">Войдите, чтобы управлять своими открытками</p>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-auth">Войти</button>
    </form>

    <p class="auth-footer">
      Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
    </p>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = '';

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();

    if (data.success) {
      window.location.href = '/dashboard';
    } else {
      alertBox.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
    }
  });
</script>
</body>
</html>
