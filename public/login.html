<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — InviteCard</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-box { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 2.5rem; width: 100%; max-width: 420px; border: 1px solid var(--border); }
    .auth-box h1 { font-size: 1.6rem; margin-bottom: 0.4rem; }
    .auth-box p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <a href="/" style="color:var(--primary);font-weight:700;font-size:1.1rem">💌 InviteCard</a>
    <h1 style="margin-top:1.2rem">Вход</h1>
    <p>Войдите, чтобы управлять своими открытками</p>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">📧 Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">🔐 Пароль</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-full">✔️ Войти</button>
    </form>

    <p class="text-center mt-2" style="font-size:0.9rem">
      Нет аккаунта? <a href="/register.html">📲 Зарегистрироваться</a>
    </p>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = '';

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();

    if (data.success) {
      window.location.href = '/dashboard';
    } else {
      alertBox.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
    }
  });
</script>
</body>
</html>
