<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение — InviteCard</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/invite.css">
</head>
<body>

<div id="loadingState" class="text-center" style="padding:4rem">
  <div class="spinner"></div>
  <p class="text-muted">Загружаем приглашение...</p>
</div>

<div id="notFound" style="display:none" class="text-center" style="padding:4rem">
  <div style="font-size:4rem">⁉️</div>
  <h2>Приглашение не найдено</h2>
  <p class="text-muted mt-1">Возможно, ссылка устарела или была удалена</p>
</div>

<div id="invitePage" style="display:none">
  <div class="invite-page">
    <div id="inviteContent"></div>

    <!-- Анкета гостя -->
    <div class="guest-form" id="guestForm">
      <h2>✉️ Подтвердите участие</h2>
      <div id="guestAlert"></div>
      <div id="guestFormFields">
        <div class="form-group">
          <label>Фамилия Имя Отчество*</label>
          <input type="text" id="guestName" class="form-control" placeholder="Иванов Иван Иванович" required>
        </div>

        <div class="form-group">
          <label>Email (необязательно)</label>
          <input type="email" id="guestEmail" class="form-control" placeholder="your@email.com">
          <small style="color:#999;font-size:0.85rem">Для получения напоминаний о мероприятии</small>
        </div>

        <div class="form-group">
          <label>Присутствие</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="attending" value="yes"> Да, приду
            </label>
            <label class="radio-label">
              <input type="radio" name="attending" value="no"> Не смогу
            </label>
            <label class="radio-label">
              <input type="radio" name="attending" value="maybe" checked> Пока не знаю
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="isMinor" onchange="toggleMinorAge()">
            Несовершеннолетний гость
          </label>
        </div>

        <div class="form-group" id="minorAgeGroup" style="display:none">
          <label>Возраст</label>
          <input type="number" id="minorAge" class="form-control" min="1" max="17" placeholder="Возраст">
        </div>

        <div class="form-group">
          <label>Пожелание/заметка/примечание</label>
          <textarea id="guestNote" class="form-control" placeholder="Необязательно..."></textarea>
        </div>

        <button class="btn btn-primary w-full" onclick="submitGuest()">📨 Отправить анкету</button>
      </div>

      <div id="guestSuccess" style="display:none" class="text-center" style="padding:1rem">
        <div style="font-size:3rem">🪩</div>
        <h3 style="margin-top:0.5rem">Спасибо!</h3>
        <p class="text-muted mt-1">Ваша анкета отправлена организаторам</p>
      </div>
    </div>

    <div class="text-center mt-3" style="padding-bottom:2rem">
      <p class="text-muted" style="font-size:0.8rem">Создано с помощью <a href="/">💌 InviteCard</a></p>
    </div>
  </div>
</div>

<script src="/js/invite.js"></script>
</body>
</html>
