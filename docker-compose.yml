services:
  mysql:
    image: mysql:8.0
    container_name: invite-app-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-2573}
      MYSQL_DATABASE: ${DB_NAME:-invite_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-2573}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/my.cnf:/etc/mysql/conf.d/charset.cnf:ro
      - ./database/00-charset.sql:/docker-entrypoint-initdb.d/00-charset.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - invite-network

  app:
    build: .
    container_name: invite-app
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=${PORT:-3000}
      - SESSION_SECRET=${SESSION_SECRET:-my_secret_key_2573760}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-2573}
      - DB_NAME=${DB_NAME:-invite_app}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./public:/usr/src/app/public
    networks:
      - invite-network

networks:
  invite-network:
    driver: bridge

volumes:
  mysql_data: